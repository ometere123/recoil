name: contract-ci

on:
  push:
  pull_request:

jobs:
  direct-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-test.txt
      - name: Recoil network and security preflight
        run: python scripts/preflight.py
      - name: Python compilation
        run: python -m compileall contracts scripts tests
      - name: GenVM AST safety lint
        run: |
          genvm-lint lint contracts/recoil.py
          genvm-lint lint contracts/demo_participant.py
      - name: Direct Mode tests
        run: pytest tests/direct -q
